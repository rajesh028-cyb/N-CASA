device-name EDGE-UNKNOWN-01
management ssh enable
management telnet disable
management https enable

interface uplink0
    address 192.0.2.40/30
    state enabled
exit

interface unused0
    state disabled
exit

remote-log server 10.10.10.10
time-sync server 10.10.10.20

security-policy default-action deny
