!
! N-CASA Manual Test - Cisco Router
! Intentionally contains several insecure settings.
!
hostname N-CASA-CISCO-INSECURE
version 15.2
!
no ip ssh version 2
ip http server
no ip http secure-server
!
line vty 0 4
 transport input telnet
!
interface GigabitEthernet0/0
 description WAN
 ip address 192.0.2.10 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description UNUSED
 ip address 198.51.100.10 255.255.255.0
 no shutdown
!
end
