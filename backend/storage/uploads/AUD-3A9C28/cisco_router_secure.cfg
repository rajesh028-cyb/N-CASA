!
! N-CASA Manual Test - Cisco Router
!
hostname N-CASA-CISCO-ROUTER
version 15.2
!
ip ssh version 2
no ip http server
ip http secure-server
!
aaa new-model
enable secret 9 REDACTED_ENABLE_SECRET
!
line vty 0 4
 transport input ssh
 login local
!
logging host 10.10.10.10
ntp server 10.10.10.20
!
interface GigabitEthernet0/0
 description WAN
 ip address 192.0.2.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN
 ip address 198.51.100.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 description UNUSED
 shutdown
!
router ospf 10
 router-id 192.0.2.1
 network 198.51.100.0 0.0.0.255 area 0
!
end
